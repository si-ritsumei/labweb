                    <p class="normal">
                        社会知能研究室はタイ出身のアンペア先生や、中国、インドネシアからの留学生もおり、多国籍な研究室です。
                        そのため、それぞれの国のお菓子やお茶を持ち寄って、多文化のお茶会を不定期で開催しています！
                        中国の紅茶やお菓子，インドネシアのお菓子や，日本でもよく見るポピュラーなお菓子など，食べきれないほどたくさんのお菓子が並びました！
                        皆さんはじめて見るお菓子もあり，味やその国の文化などを話しながら楽しみました🎵
