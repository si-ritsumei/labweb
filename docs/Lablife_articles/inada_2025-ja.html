    <script>
        const filePath = "../img/event_news/2025/inada2025/"; // 画像ファイルがあるフォルダのパスを変数に格納
        const fileNames = ["DSC02186.JPG","DSC02184.JPG","DSC02185.JPG"];
        const backgroundImage = "";  //背景画像を指定

        // 画像のIDを自動生成して配列に格納
        const numberOfImages = 6; //画像の数を指定(swiperを使用する場合は2倍の数になる)
        const ids = [];
        for (let i = 1; i <= numberOfImages; i++) {
            ids.push(`img${i}`);
        }

        // for文を使用して画像のsrcを設定
        for (let i = 0; i < ids.length; i++) {
            const imgIndex = i % fileNames.length; // ファイル名のインデックスを計算
            document.getElementById(ids[i]).src = filePath + fileNames[imgIndex];
        }

        // body要素の背景画像を設定
        document.body.style.backgroundImage = `url(${filePath}${backgroundImage})`;
    </script>
