<body id="top" class="scrollspy">

    <!--Navigation-->
    <div id="myNavbar" data-active="2" data-language="ja">
    </div>

    <div class="container">
        <h4 class="header text_b">Laboratory Life</h4>
        <div class="section scrollspy">
            <p class="normal">
                3回生が滋賀県国際交流協会でフィールドワークを行いました。
            </p>

            <div class="row">
                <div class="column leftc">
                    <div align="center">
                        <img id="img1" width=100% style="align-content: center" alt="" />
                    </div>
                </div>
                <div class="column rightc">
                    <p class="smallheader">概要</p>
                    <p class="normal">
                    2022 年 10 月 13 日、本研究室の3回生が在住外国人を支援するアプリケーション開発のため、滋賀県国際交流協会 (SIA) を訪問し、フィールドワークを行いました。
                    <p>

                    <p class="normal">

                    今回のフィールドワークでは、滋賀県国際協会の方に在住外国人や、SIAの外国人支援の取り組みについて教えて頂きました．また、滋賀県在住の外国人が直面している様々な問題についてインタビューを行い、議論しました。
				</p>
                </div>
            </div>
            <div class="row">
                <div class="column leftc" style="margin-left: 0; margin-top: 0">
                    <img id="img2" width=100% alt="" />
                </div>
                <div class="column rightc" style="margin-left: 0; margin-top: 0">
                    <img id="img3" width=100% alt="" />
                </div>
            </div>
        </div>
    </div>

    <!--Footer-->
    <div id="myFooter">
    </div>

    <!--  Scripts-->
    <script src="../js/jquery-2.1.1.min.js"></script>
    <script src="../js/myjs.js"></script>
    <script src="../js/modernizr.js"></script>
    <script src="../js/materialize.js"></script>
    <script src="../js/init.js"></script>
    <script>
        const filePath = "../img/event_news/2022/SIA2022/"; // 画像ファイルがあるフォルダのパスを変数に格納
        const fileNames = ["2022_SIA_1.jpg","2022_SIA_2.jpg","2022_SIA_3.jpg"];
        const backgroundImage = "";  //背景画像を指定

        // 画像のIDを自動生成して配列に格納
        const numberOfImages = 3; //画像の数を指定(swiperを使用する場合は2倍の数になる)
        const ids = [];
        for (let i = 1; i <= numberOfImages; i++) {
            ids.push(`img${i}`);
        }

        // for文を使用して画像のsrcを設定
        for (let i = 0; i < ids.length; i++) {
            const imgIndex = i % fileNames.length; // ファイル名のインデックスを計算
            document.getElementById(ids[i]).src = filePath + fileNames[imgIndex];
        }

        // body要素の背景画像を設定
        document.body.style.backgroundImage = `url(${filePath}${backgroundImage})`;
    </script>

</body>
