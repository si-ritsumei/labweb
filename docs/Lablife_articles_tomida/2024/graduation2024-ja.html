    <script src="../js/materialize.js"></script>
    <script src="../js/init.js"></script>
    <script>
        const filePath = "../img/event_news/2024/graduation2024/"; // 画像ファイルがあるフォルダのパスを変数に格納
        const fileNames = ["graduate2024-1.JPG", "graduate2024-2.JPG", "graduate2024-3.JPG"];
        const backgroundImage = "sakura_haikei.png";  //背景画像を指定

        // 画像のIDを自動生成して配列に格納
        const numberOfImages = 3; //画像の数を指定
        const ids = [];
        for (let i = 1; i <= numberOfImages; i++) {
            ids.push(`img${i}`);
        }

        // for文を使用して画像のsrcを設定
        for (let i = 0; i < ids.length; i++) {
            const imgIndex = i % fileNames.length; // ファイル名のインデックスを計算
            document.getElementById(ids[i]).src = filePath + fileNames[imgIndex];
        }

        // body要素の背景画像を設定
        document.body.style.backgroundImage = `url(${filePath}${backgroundImage})`;
    </script>
